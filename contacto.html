        <!-- ! Contededor del Formulario -->

        <!-- ! Formulario Registro -->
        <form class="formulario">
            <!-- ! Titulo del Formulario Registro-->
            <h1 class="titulo_registro">Login</h1>
            <!-- ! Contenedor de Contacto -->
            <div class="contenedor_contacto">
                <!-- ! Contendor de los Input -->
                <div class="input-contenedor_contacto">
                    <!-- ! Icono de Usuario -->
                    <img class="icon" alt="icono-usuario" src="icon/usuario-de-perfil.png">
                    <!-- ! Input de Nombre de Usuario -->
                    <input type="text" placeholder="User name">
                </div>
                <!-- ! Contendor de los Input -->
                <div class="input-contenedor_contacto">
                    <!-- ! Icono de Correo Electronico -->
                    <img class="icon" alt="icono-correo" src="icon/correo-electronico.png">
                    <!-- ! Input de Correo Electronico -->
                    <input type="text" placeholder="Mail">
                </div>
                <!-- ! Contendor de los Input -->
                <div class="input-contenedor_contacto">
                    <!-- ! Icono de Contraseña -->
                    <img class="icon" alt="icono-contraseña" src="icon/contraseña.png">
                    <!-- ! Input de Contraseña -->
                    <input type="password" placeholder="Password">
                </div>
                <!-- ! Boton de Registro -->
                <input type="submit" value="Sign up" class="button">
                <!-- ! Texto de Registro -->
                <p class="texto_formulario">By registering, you agree to our terms of use and privacy policy.</p>
                <p class="texto_formulario">Do you already have an account? <a href="contactoDos.html" class="link"> Sign in</a></p>
